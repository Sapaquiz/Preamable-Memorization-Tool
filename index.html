<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preamble Memorization Tool</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  color: #29200f;

  /* Classic yellow pad paper */
  background:
    repeating-linear-gradient(
      to bottom,
      #f7e7a6 0px,
      #f7e7a6 31px,
      rgba(88, 119, 150, 0.28) 32px,
      #f7e7a6 33px
    );
}

.page {
  width: min(1000px, 94%);
  margin: 28px auto;
  padding: 28px 34px 40px;
  background: rgba(255, 247, 194, 0.75);
  border-left: 1px solid rgba(120, 91, 35, 0.18);
  border-right: 1px solid rgba(120, 91, 35, 0.18);
  box-shadow: 0 8px 25px rgba(74, 53, 10, 0.12);
  border-radius: 8px;
}

h1 {
  margin: 0 0 5px;
  text-align: center;
  font-size: clamp(25px, 5vw, 42px);
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  margin: 0 0 20px;
  color: #66511e;
  font-size: 15px;
}

/* Buttons */
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

button {
  border: 1px solid #8a6b20;
  background: #d9bd62;
  color: #2d240d;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 15px;
  transition: transform 0.12s, background 0.12s;
}

button:hover {
  background: #e6cc78;
}

button:active {
  transform: scale(0.97);
}

/* Preamble text */
.text {
  font-size: clamp(19px, 2.7vw, 27px);
  line-height: 2.05;
  text-align: left;
}

.word {
  display: inline-block;
  vertical-align: baseline;
  margin: 0 2px;
  padding: 1px 5px;
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}

/* Covered word */
.word.hidden {
  background: #594818;
  color: transparent;
  min-width: 34px;
  height: 1.35em;
  vertical-align: middle;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.word.hidden:hover {
  background: #725d20;
}

/* Revealed word */
.word.revealed {
  background: rgba(255, 255, 255, 0.22);
  color: inherit;
}

.punct {
  margin-left: -1px;
}

.hint {
  margin-top: 28px;
  text-align: center;
  color: #705b27;
  font-size: 14px;
}

/* YouTube section */
.video-section {
  margin-top: 45px;
  padding-top: 25px;
  border-top: 2px dashed rgba(100, 75, 20, 0.3);
}

.video-section h2 {
  text-align: center;
  margin: 0 0 18px;
  font-size: clamp(21px, 4vw, 30px);
  color: #493914;
}

.video-container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(60, 45, 10, 0.2);
  background: #000;
}

.video-container iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.video-note {
  text-align: center;
  color: #705b27;
  font-size: 13px;
  margin-top: 12px;
}

/* Mobile */
@media (max-width: 600px) {
  .page {
    padding: 22px 17px 30px;
    margin: 12px auto;
  }

  .text {
    line-height: 1.9;
  }

  .word {
    margin: 0 1px;
    padding: 1px 4px;
  }

  .word.hidden {
    min-width: 28px;
  }
}
</style>
</head>

<body>

<main class="page">

  <h1>PREAMBLE</h1>
  <p class="subtitle">1987 Philippine Constitution — Memorization Tool</p>

  <div class="controls">
    <button id="hideAll" type="button">Hide All</button>
    <button id="revealAll" type="button">Reveal All</button>
  </div>

  <!-- Preamble -->
  <section class="text" id="preamble" aria-label="Preamble memorization text"></section>

  <div class="hint">
    Tap/click any covered word to reveal it. Tap it again to hide it.
  </div>

  <!-- YouTube Video -->
  <section class="video-section">
    <h2>🎥 Preamble Video</h2>

    <div class="video-container">
      <iframe
        src="https://www.youtube-nocookie.com/embed/304YGLJ3j5w"
        title="Preamble - 1987 Philippine Constitution"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video-note">
      Watch the video directly on this page.
    </div>
  </section>

</main>

<script>
/*
  TEXT TO MEMORIZE
*/
const text = `We, the sovereign Filipino people, imploring the aid of Almighty God, in order to build a just and humane society, and establish a Government that shall embody our ideals and aspirations, promote the common good, conserve and develop our patrimony, and secure to ourselves and our posterity, the blessings of independence and democracy under the rule of law and a regime of truth, justice, freedom, love, equality, and peace, do ordain and promulgate this Constitution.`;

const container = document.getElementById("preamble");

/*
  Split the text into:
  - words
  - punctuation
  - spaces

  Only words become clickable blocks.
  Punctuation remains visible.
*/
const tokens = text.match(/[A-Za-z0-9]+|[^A-Za-z0-9\s]+|\s+/g) || [];

tokens.forEach(token => {

  // WORD
  if (/^[A-Za-z0-9]+$/.test(token)) {

    const span = document.createElement("span");

    span.className = "word hidden";
    span.textContent = token;

    span.setAttribute("role", "button");
    span.setAttribute("tabindex", "0");
    span.setAttribute("aria-label", "Hidden word");

    function toggleWord() {
      span.classList.toggle("hidden");
      span.classList.toggle("revealed");

      if (span.classList.contains("hidden")) {
        span.setAttribute("aria-label", "Hidden word");
      } else {
        span.setAttribute(
          "aria-label",
          "Revealed word: " + token
        );
      }
    }

    // Mouse / touchscreen
    span.addEventListener("click", toggleWord);

    // Keyboard support
    span.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleWord();
      }
    });

    container.appendChild(span);

  // SPACE
  } else if (/^\s+$/.test(token)) {

    container.appendChild(
      document.createTextNode(token)
    );

  // PUNCTUATION
  } else {

    const punct = document.createElement("span");

    punct.className = "punct";
    punct.textContent = token;

    container.appendChild(punct);
  }
});


/*
  HIDE ALL
*/
document.getElementById("hideAll").addEventListener("click", function() {

  document.querySelectorAll(".word").forEach(word => {

    word.classList.add("hidden");
    word.classList.remove("revealed");

    word.setAttribute("aria-label", "Hidden word");
  });

});


/*
  REVEAL ALL
*/
document.getElementById("revealAll").addEventListener("click", function() {

  document.querySelectorAll(".word").forEach(word => {

    word.classList.remove("hidden");
    word.classList.add("revealed");

    word.setAttribute(
      "aria-label",
      "Revealed word: " + word.textContent
    );
  });

});
</script>

</body>
</html>
