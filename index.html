<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preamble Memorization Tool</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: #29200f;
    background:
      repeating-linear-gradient(
        to bottom,
        #f7e7a6 0px,
        #f7e7a6 31px,
        rgba(88, 119, 150, 0.28) 32px,
        #f7e7a6 33px
      );
  }

  .page {
    width: min(1000px, 94%);
    margin: 28px auto;
    padding: 28px 34px 40px;
    background: rgba(255, 247, 194, 0.72);
    border-left: 1px solid rgba(120, 91, 35, .18);
    border-right: 1px solid rgba(120, 91, 35, .18);
    box-shadow: 0 8px 25px rgba(74, 53, 10, .12);
    border-radius: 8px;
  }

  h1 {
    margin: 0 0 5px;
    text-align: center;
    font-size: clamp(25px, 5vw, 42px);
    letter-spacing: 1px;
  }

  .subtitle {
    text-align: center;
    margin: 0 0 20px;
    color: #66511e;
    font-size: 15px;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }

  button {
    border: 1px solid #8a6b20;
    background: #d9bd62;
    color: #2d240d;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 15px;
    transition: transform .12s, background .12s;
  }

  button:hover { background: #e6cc78; }
  button:active { transform: scale(.97); }

  .text {
    font-size: clamp(19px, 2.7vw, 27px);
    line-height: 2.05;
    text-align: left;
  }

  .word {
    display: inline-block;
    vertical-align: baseline;
    margin: 0 2px;
    padding: 1px 5px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s, box-shadow .15s;
  }

  .word.hidden {
    background: #594818;
    color: transparent;
    min-width: 34px;
    height: 1.35em;
    vertical-align: middle;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }

  .word.hidden:hover {
    background: #725d20;
  }

  .word.revealed {
    background: rgba(255,255,255,.22);
    color: inherit;
  }

  .punct {
    margin-left: -1px;
  }

  .hint {
    margin-top: 28px;
    text-align: center;
    color: #705b27;
    font-size: 14px;
  }

  @media (max-width: 600px) {
    .page {
      padding: 22px 17px 30px;
      margin: 12px auto;
    }
    .text {
      line-height: 1.9;
    }
  }
</style>
</head>
<body>
<main class="page">
  <h1>PREAMBLE</h1>
  <p class="subtitle">1987 Philippine Constitution — Memorization Tool</p>

  <div class="controls">
    <button id="hideAll" type="button">Hide All</button>
    <button id="revealAll" type="button">Reveal All</button>
  </div>

  <section class="text" id="preamble" aria-label="Preamble memorization text"></section>

  <div class="hint">Tap/click any covered word to reveal it. Tap it again to hide it.</div>
</main>

<script>
const text = `We, the sovereign Filipino people, imploring the aid of Almighty God, in order to build a just and humane society, and establish a Government that shall embody our ideals and aspirations, promote the common good, conserve and develop our patrimony, and secure to ourselves and our posterity, the blessings of independence and democracy under the rule of law and a regime of truth, justice, freedom, love, equality, and peace, do ordain and promulgate this Constitution.`;

const container = document.getElementById("preamble");

// Split into words while keeping punctuation visible and separate.
const tokens = text.match(/[A-Za-z0-9]+|[^A-Za-z0-9\\s]+|\\s+/g) || [];

tokens.forEach(token => {
  if (/^[A-Za-z0-9]+$/.test(token)) {
    const span = document.createElement("span");
    span.className = "word hidden";
    span.textContent = token;
    span.setAttribute("role", "button");
    span.setAttribute("tabindex", "0");
    span.setAttribute("aria-label", "Hidden word");

    const toggle = () => {
      span.classList.toggle("hidden");
      span.classList.toggle("revealed");
      span.setAttribute(
        "aria-label",
        span.classList.contains("hidden") ? "Hidden word" : "Revealed word: " + token
      );
    };

    span.addEventListener("click", toggle);
    span.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle();
      }
    });

    container.appendChild(span);
  } else if (/^\\s+$/.test(token)) {
    container.appendChild(document.createTextNode(token));
  } else {
    const punct = document.createElement("span");
    punct.className = "punct";
    punct.textContent = token;
    container.appendChild(punct);
  }
});

document.getElementById("hideAll").addEventListener("click", () => {
  document.querySelectorAll(".word").forEach(word => {
    word.classList.add("hidden");
    word.classList.remove("revealed");
    word.setAttribute("aria-label", "Hidden word");
  });
});

document.getElementById("revealAll").addEventListener("click", () => {
  document.querySelectorAll(".word").forEach(word => {
    word.classList.remove("hidden");
    word.classList.add("revealed");
    word.setAttribute("aria-label", "Revealed word: " + word.textContent);
  });
});
</script>
</body>
</html>
